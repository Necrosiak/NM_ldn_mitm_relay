services:
  slp-server:
    image: spacemeowx2/slp-server-rust
    container_name: slp-server
    restart: unless-stopped
    ports:
      - "11451:11451/udp"
      - "11451:11451/tcp"
    networks:
      - lanrelay

  psp-adhocctl:
    image: ghcr.io/souler/ppsspp-adhoc
    container_name: psp-adhocctl
    restart: unless-stopped
    ports:
      - "27312:27312/tcp"
    networks:
      - lanrelay

  psp-postoffice:
    build:
      context: ./aemu_postoffice
    container_name: psp-postoffice
    restart: unless-stopped
    ports:
      - "27313:27313/udp"
      - "27313:27313/tcp"
    networks:
      - lanrelay

networks:
  lanrelay:
    driver: bridge
